<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:transparent;position:relative;
  font-family:'Courier New',monospace}

/* top block */
.top{position:absolute;top:110px;left:0;right:0;text-align:center}
.logo{font-size:26px;font-weight:700;letter-spacing:11px;color:rgba(240,244,255,.95);
  text-shadow:0 2px 20px rgba(0,0,0,.8)}
.logo b{color:#00D4F0}
.tag{font-size:12px;letter-spacing:6px;color:rgba(240,244,255,.45);margin-top:12px}

/* headline above the video band */
.headline{position:absolute;top:330px;left:80px;right:80px;text-align:center}
h1{font-family:Georgia,serif;font-size:84px;font-weight:700;line-height:1.06;
  color:#f0f4ff;letter-spacing:-1px;text-shadow:0 4px 40px rgba(0,0,0,.9)}
h1 em{font-style:italic;color:#00D4F0}
h1 .g{font-style:italic;color:#dfa84a}

/* sub below video band */
.deck{position:absolute;top:1240px;left:110px;right:110px;text-align:center;
  font-family:Georgia,serif;font-size:30px;line-height:1.5;color:rgba(206,214,232,.85);
  text-shadow:0 2px 20px rgba(0,0,0,.9)}
.deck b{color:#dfa84a}

/* bottom CTA */
.bottom{position:absolute;bottom:130px;left:0;right:0;text-align:center}
.offer{font-family:Georgia,serif;font-size:64px;font-weight:700;color:#f0f4ff;margin-bottom:12px;
  text-shadow:0 4px 30px rgba(0,0,0,.9)}
.offer em{font-style:italic;color:#dfa84a}
.sub{font-size:15px;letter-spacing:4px;color:rgba(196,206,228,.6);margin-bottom:36px}
.btn{display:inline-block;background:#00D4F0;color:#02050a;font-weight:700;
  font-size:19px;letter-spacing:5px;padding:24px 56px;border-radius:8px;
  box-shadow:0 0 70px rgba(0,212,240,.55)}
.url{margin-top:22px;font-size:15px;letter-spacing:4px;color:rgba(0,212,240,.8)}
</style>
</head>
<body>
  <!-- feather bands: video sits y≈691–1228, blend its edges into bg -->
  <div style="position:absolute;left:0;right:0;top:670px;height:80px;background:linear-gradient(180deg,#02050a,rgba(2,5,10,0))"></div>
  <div style="position:absolute;left:0;right:0;top:1150px;height:90px;background:linear-gradient(0deg,#02050a,rgba(2,5,10,0))"></div>
  <div style="position:absolute;left:0;top:670px;bottom:692px;width:70px;background:linear-gradient(90deg,#02050a,rgba(2,5,10,0))"></div>
  <div style="position:absolute;right:0;top:670px;bottom:692px;width:70px;background:linear-gradient(270deg,#02050a,rgba(2,5,10,0))"></div>

  <div class="top">
    <div class="logo">STRIKE<b>PANEL</b>™</div>
    <div class="tag">FIGHT CAMP INTELLIGENCE</div>
  </div>

  <div class="headline">
    <h1>Know who's <em>ready</em><br>before they<br>walk <span class="g">in.</span></h1>
  </div>

  <div class="deck">
    A 0–100 readiness score for every fighter,<br>every morning. <b>Who to push. Who to protect.</b>
  </div>

  <div class="bottom">
    <div class="offer">14 days. <em>Free.</em></div>
    <div class="sub">NO CARD · NO SUBSCRIPTION · FULL APP</div>
    <div class="btn">START FREE TRIAL</div>
    <div class="url">strikepanel.uk</div>
  </div>
</body>
</html>
