<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:#02050a;position:relative;
  font-family:'Courier New',monospace}

/* background: heavily darkened fight photo + teal glow */
.bg{position:absolute;inset:0;background:url('boxing.jpg') center 15%/cover no-repeat;
  filter:brightness(.28) saturate(.6) contrast(1.1)}
.glow{position:absolute;inset:0;background:radial-gradient(
  ellipse 60% 45% at 50% 52%, rgba(0,212,240,.16) 0%, transparent 70%)}
.floor-glow{position:absolute;left:50%;top:74%;width:560px;height:60px;transform:translateX(-50%);
  background:radial-gradient(ellipse, rgba(0,212,240,.35) 0%, transparent 70%);
  filter:blur(18px)}
.grain{position:absolute;inset:0;opacity:.25;z-index:40;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:140px 140px;mix-blend-mode:soft-light}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 300px 60px rgba(2,5,10,.85)}

/* header / footer */
.top{position:absolute;top:64px;left:0;right:0;text-align:center;z-index:30}
.logo{font-size:24px;font-weight:700;letter-spacing:10px;color:rgba(240,244,255,.92)}
.logo b{color:#00D4F0}
.tag{font-size:11px;letter-spacing:5px;color:rgba(240,244,255,.4);margin-top:10px}

.bottom{position:absolute;bottom:72px;left:0;right:0;text-align:center;z-index:30}
.offer{font-family:Georgia,serif;font-size:54px;font-weight:700;color:#f0f4ff;margin-bottom:10px}
.offer em{font-style:italic;color:#dfa84a}
.sub{font-size:13px;letter-spacing:4px;color:rgba(196,206,228,.55);margin-bottom:26px}
.btn{display:inline-block;background:#00D4F0;color:#02050a;font-weight:700;
  font-size:16px;letter-spacing:4px;padding:20px 48px;border-radius:6px;
  box-shadow:0 0 60px rgba(0,212,240,.5)}

/* ── 3D phone ── */
.scene{position:absolute;left:50%;top:50%;transform:translate(-50%,-54%);
  width:400px;height:850px;perspective:1400px;z-index:20}
.phone{position:absolute;inset:0;transform-style:preserve-3d;
  transform:rotateY(0deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:44px;overflow:hidden}
.front{background:#060a12;
  box-shadow:0 0 0 2px rgba(0,212,240,.4),0 0 90px rgba(0,212,240,.25)}
.front img{width:100%;height:100%;object-fit:cover}
.back{transform:rotateY(180deg);background:linear-gradient(150deg,#0d1526 0%,#060a12 60%);
  box-shadow:0 0 0 2px rgba(0,212,240,.4),0 0 90px rgba(0,212,240,.25);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.back .crest{width:120px;height:120px;border-radius:50%;border:2px solid rgba(0,212,240,.5);
  display:flex;align-items:center;justify-content:center;position:relative}
.back .crest::before{content:'';position:absolute;inset:14px;border-radius:50%;
  border:1px solid rgba(0,212,240,.25)}
.back .dot{width:30px;height:30px;border-radius:50%;background:#00D4F0;
  box-shadow:0 0 40px rgba(0,212,240,.8)}
.back .bl{font-size:17px;font-weight:700;letter-spacing:7px;color:rgba(240,244,255,.92)}
.back .bl b{color:#00D4F0}
.back .bt{font-size:9px;letter-spacing:4px;color:rgba(196,206,228,.4)}
/* edge slab for thickness illusion */
.edge{position:absolute;top:6px;bottom:6px;left:50%;width:24px;
  transform:translateX(-50%) rotateY(90deg);
  background:linear-gradient(180deg,#0c1422,#04070f);border-radius:6px}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="glow"></div>
  <div class="floor-glow"></div>
  <div class="vig"></div>

  <div class="top">
    <div class="logo">STRIKE<b>PANEL</b>™</div>
    <div class="tag">FIGHT CAMP INTELLIGENCE</div>
  </div>

  <div class="scene">
    <div class="phone" id="phone">
      <div class="edge"></div>
      <div class="face front"><img src="phone-morning-brief.png" alt=""></div>
      <div class="face back">
        <div class="crest"><div class="dot"></div></div>
        <div class="bl">STRIKE<b>PANEL</b></div>
        <div class="bt">EST. 2026 · STRIKEPANEL.UK</div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="offer">14 days. <em>Free.</em></div>
    <div class="sub">NO CARD · FULL APP · STRIKEPANEL.UK</div>
    <div class="btn">START FREE TRIAL</div>
  </div>

  <div class="grain"></div>

<script>
// Driven frame-by-frame from Puppeteer: window.setFrame(i, total)
window.setFrame = function(i, total){
  const t = i / total;                      // 0..1
  const yRot = t * 360;                     // full spin
  const bob  = Math.sin(t * Math.PI * 2) * 14;     // float up/down
  const tilt = Math.sin(t * Math.PI * 2) * 4 - 6;  // gentle sway, slight lean
  document.getElementById('phone').style.transform =
    'translateY(' + bob + 'px) rotateX(' + tilt + 'deg) rotateY(' + yRot + 'deg)';
};
</script>
</body>
</html>
