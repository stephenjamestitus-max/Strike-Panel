name: Weekly Instagram Insights

on:
  schedule:
    # Every Sunday at 7pm UTC — runs before content generation
    - cron: '0 19 * * 0'
  workflow_dispatch:

jobs:
  insights:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Instagram insights
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
        run: python scripts/marketing/instagram_insights.py

      - name: Commit insights log
        run: |
          git config user.name "StrikePanel Bot"
          git config user.email "bot@strikepanel.app"
          git add scripts/marketing/insights_log.json
          git diff --staged --quiet || git commit -m "chore: instagram insights $(date +%Y-%m-%d)"
          git push
