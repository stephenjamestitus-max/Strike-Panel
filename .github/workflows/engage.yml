name: Engage (daily comments)

on:
  schedule:
    - cron: '0 13 * * *'   # 17:00 Dubai (UTC+4) — peak US morning / UK afternoon
  workflow_dispatch:

jobs:
  engage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate today's 15 comments
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/marketing/run-engage.js

      - name: Commit updated logs
        run: |
          git config user.name "StrikePanel Bot"
          git config user.email "automation@strikepanel.com"
          git add scripts/marketing/engage_queue.json scripts/marketing/engage_log.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update engage log [skip ci]"
          git push
