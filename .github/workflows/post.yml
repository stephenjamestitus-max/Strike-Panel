name: Instagram Post

on:
  # Tue 7pm Dubai (3pm UTC), Fri 5pm Dubai (1pm UTC), Sun 8pm Dubai (4pm UTC)
  schedule:
    - cron: '0 15 * * 2'  # Tuesday
    - cron: '0 13 * * 5'  # Friday
    - cron: '0 16 * * 0'  # Sunday
  workflow_dispatch: {}  # Allow manual trigger from GitHub UI

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/tender-lamport-hGL7A

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer browser
        run: npx puppeteer browsers install chrome

      - name: Run daily post
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NEXT_PUBLIC_APP_URL: https://strikepanel.vercel.app
        run: node scripts/marketing/run-daily.js

      - name: Commit posted_log.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/marketing/posted_log.json
          git diff --cached --quiet || git commit -m "chore: update posted_log.json [skip ci]"
          git push origin claude/tender-lamport-hGL7A
