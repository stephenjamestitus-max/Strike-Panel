name: Generate Weekly Content

on:
  schedule:
    # Every Sunday at 8pm UTC (midnight Dubai, good timing)
    - cron: '0 20 * * 0'
  workflow_dispatch: # allow manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install cryptography

      - name: Generate weekly content batch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/marketing/generate_content.py

      - name: Save to Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python scripts/marketing/save_to_drive.py
        continue-on-error: true

      - name: Commit updated content batch
        run: |
          git config user.name "StrikePanel Bot"
          git config user.email "bot@strikepanel.app"
          git add scripts/marketing/content_batch.json
          git diff --staged --quiet || git commit -m "chore: weekly content batch $(date +%Y-%m-%d)"
          git push
