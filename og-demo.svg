  <rect x="72" y="180" width="150" height="32" rx="16" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="100" cy="196" r="5" fill="#10b981"/>
  <text x="145" y="200" font-family="Courier New,Courier,monospace" font-weight="700" font-size="13" fill="#10b981" text-anchor="middle" letter-spacing="2">LIVE DEMO</text>

