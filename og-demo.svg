  <text x="72" y="310" font-family="Arial Black,Helvetica Neue,Arial,sans-serif" font-weight="900" font-size="80" fill="url(#textgrad)" letter-spacing="1">Try Every</text>
  <text x="72" y="405" font-family="Arial Black,Helvetica Neue,Arial,sans-serif" font-weight="900" font-size="80" fill="url(#greengrad)" letter-spacing="1">Feature Free</text>

