  <rect x="72" y="422" width="420" height="1.5" fill="#10b981" fill-opacity="0.3" rx="1"/>

  <!-- Sub -->
  <text x="72" y="464" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#64748b">No sign-up · No card · Full app · Buy once for $99</text>

  <!-- Feature tags right side -->
  <g transform="translate(760, 160)">
    <rect width="360" height="64" rx="10" fill="rgba(0,212,240,0.07)" stroke="rgba(0,212,240,0.2)" stroke-width="1"/>
    <text x="22" y="38" font-family="Arial,sans-serif" font-size="18" fill="#ffffff">⚡  Morning Brief</text>
    <text x="280" y="38" font-family="Arial,sans-serif" font-size="13" fill="#00D4F0">LIVE</text>
  </g>
  <g transform="translate(760, 242)">
    <rect width="360" height="64" rx="10" fill="rgba(139,92,246,0.07)" stroke="rgba(139,92,246,0.2)" stroke-width="1"/>
    <text x="22" y="38" font-family="Arial,sans-serif" font-size="18" fill="#ffffff">🥊  Fight Camp Planner</text>
  </g>
  <g transform="translate(760, 324)">
    <rect width="360" height="64" rx="10" fill="rgba(245,158,11,0.07)" stroke="rgba(245,158,11,0.2)" stroke-width="1"/>
    <text x="22" y="38" font-family="Arial,sans-serif" font-size="18" fill="#ffffff">⚖️  Weight Cut Tracker</text>
  </g>
  <g transform="translate(760, 406)">
    <rect width="360" height="64" rx="10" fill="rgba(16,185,129,0.07)" stroke="rgba(16,185,129,0.2)" stroke-width="1"/>
    <text x="22" y="38" font-family="Arial,sans-serif" font-size="18" fill="#ffffff">✦  AI Session Builder</text>
