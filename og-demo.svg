      <line x1="60" y1="87" x2="60" y2="114" stroke-width="3"/>
      <line x1="6" y1="60" x2="33" y2="60" stroke-width="3"/>
      <line x1="87" y1="60" x2="114" y2="60" stroke-width="3"/>
    </g>
    <g stroke="#00D4F0" stroke-linecap="round" stroke-opacity="0.5">
      <line x1="19" y1="19" x2="27" y2="27" stroke-width="2"/>
      <line x1="101" y1="101" x2="93" y2="93" stroke-width="2"/>
      <line x1="101" y1="19" x2="93" y2="27" stroke-width="2"/>
      <line x1="19" y1="101" x2="27" y2="93" stroke-width="2"/>
    </g>
    <circle cx="60" cy="60" r="13" fill="#00D4F0" filter="url(#orbglow)"/>
    <circle cx="55.5" cy="55.5" r="4.5" fill="white" fill-opacity="0.25"/>
    <text x="60" y="64.5" font-family="Arial Black,sans-serif" font-weight="900" font-size="10" fill="#07111e" text-anchor="middle" letter-spacing="0.8">SP</text>
