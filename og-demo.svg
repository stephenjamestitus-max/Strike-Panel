  <text x="600" y="588" font-family="Courier New,Courier,monospace" font-size="14" fill="#3d4560" text-anchor="middle" letter-spacing="3">STRIKEPANEL.VERCEL.APP/DEMO</text>
  <rect y="627.5" width="1200" height="2.5" fill="#10b981" fill-opacity="0.3"/>
