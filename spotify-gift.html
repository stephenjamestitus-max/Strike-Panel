<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">A Song for You 🎵</title>
  <meta id="og-title" property="og:title" content="A Song for You">
  <meta id="og-desc" property="og:description" content="Someone sent you a music gift">
  <meta id="og-img" property="og:image" content="">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --surface2: #242424;
      --green: #1DB954;
      --green-dim: #169040;
      --white: #ffffff;
      --muted: #999;
      --faint: #555;
      --radius: 18px;
      --font: 'DM Sans', system-ui, sans-serif;
      --font-hand: 'Caveat', cursive;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem 4rem;
      overflow-x: hidden;
    }

    /* ── ambient glow ── */
    body::before {
      content: '';
      position: fixed;
      top: -30%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(29,185,84,0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    #app { position: relative; z-index: 1; width: 100%; max-width: 480px; }

    /* ════════════════════════════════
       VINYL RECORD
    ════════════════════════════════ */
    .vinyl-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .vinyl-stage {
      position: relative;
      width: 300px;
      height: 300px;
    }

    /* tonearm */
    .tonearm {
      position: absolute;
      top: -10px;
      right: -30px;
      width: 90px;
      height: 120px;
      transform-origin: top right;
      transform: rotate(-30deg);
      transition: transform 0.6s ease;
      z-index: 10;
    }
    .tonearm.playing { transform: rotate(-18deg); }

    .tonearm-svg { width: 100%; height: 100%; }

    .vinyl {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      position: relative;
      will-change: transform;
      animation: spin 3.5s linear infinite;
      animation-play-state: paused;
      filter: drop-shadow(0 30px 60px rgba(0,0,0,0.9));
    }
    .vinyl.playing { animation-play-state: running; }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .vinyl-disc {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background:
        repeating-radial-gradient(
          circle at center,
          transparent 0px,
          transparent 6px,
          rgba(255,255,255,0.025) 6px,
          rgba(255,255,255,0.025) 7px
        ),
        radial-gradient(circle at center, #2c2c2c 0%, #111 60%, #0a0a0a 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.08),
        0 0 0 2px rgba(0,0,0,0.6);
    }

    /* sheen */
    .vinyl-disc::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, transparent 50%);
    }

    /* center label */
    .vinyl-label {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 108px;
      height: 108px;
      border-radius: 50%;
      overflow: hidden;
      background: #222;
      border: 3px solid rgba(255,255,255,0.1);
      z-index: 2;
    }
    .vinyl-label img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .vinyl-label .label-placeholder {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, #1DB954 0%, #0d5e2a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }

    /* spindle dot */
    .vinyl-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      z-index: 3;
    }

    /* play button overlay */
    .vinyl-play-btn {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.4);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 5;
    }
    .vinyl-stage:hover .vinyl-play-btn { opacity: 1; }
    .vinyl-play-btn svg { width: 56px; height: 56px; }

    /* ── track info ── */
    .track-info {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .track-name {
      font-size: 1.35rem;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }
    .track-artist {
      font-size: 0.95rem;
      color: var(--muted);
    }

    /* ── Spotify button ── */
    .btn-spotify {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--green);
      color: #000;
      font-family: var(--font);
      font-size: 0.875rem;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, transform 0.1s;
      margin-top: 4px;
    }
    .btn-spotify:hover { background: #1ed760; transform: scale(1.03); }
    .btn-spotify:active { transform: scale(0.98); }
    .btn-spotify svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* ════════════════════════════════
       MESSAGE CARD
    ════════════════════════════════ */
    .message-card {
      margin-top: 2rem;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--radius);
      padding: 1.5rem 1.75rem;
      position: relative;
      overflow: hidden;
    }
    .message-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--green), transparent);
    }
    .message-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 0.75rem;
    }
    .message-text {
      font-family: var(--font-hand);
      font-size: 1.45rem;
      line-height: 1.5;
      color: var(--white);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── send your own ── */
    .footer-link {
      margin-top: 2.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--faint);
    }
    .footer-link a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .footer-link a:hover { color: var(--green); }

    /* ════════════════════════════════
       EMBED PLAYER (hidden, audio source)
    ════════════════════════════════ */
    .embed-wrap {
      margin-top: 1.5rem;
      border-radius: 12px;
      overflow: hidden;
    }
    .embed-wrap iframe {
      display: block;
      border-radius: 12px;
      width: 100%;
    }

    /* ════════════════════════════════
       CREATOR MODE
    ════════════════════════════════ */
    .creator {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .creator-header {
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .creator-header h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    .creator-header p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 6px;
    }

    .field { display: flex; flex-direction: column; gap: 8px; }
    .field label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .field input, .field textarea {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: var(--white);
      font-family: var(--font);
      font-size: 0.95rem;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.15s;
      resize: none;
    }
    .field input::placeholder, .field textarea::placeholder { color: var(--faint); }
    .field input:focus, .field textarea:focus { border-color: var(--green); }

    .field textarea { min-height: 100px; line-height: 1.5; }

    .track-preview {
      background: var(--surface2);
      border: 1px solid rgba(29,185,84,0.2);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      display: none;
    }
    .track-preview.visible { display: flex; }
    .track-preview img {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .track-preview-info { flex: 1; min-width: 0; }
    .track-preview-name {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-preview-artist {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .track-preview-check {
      color: var(--green);
      flex-shrink: 0;
    }

    .btn-primary {
      background: var(--green);
      color: #000;
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 600;
      padding: 14px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      width: 100%;
    }
    .btn-primary:hover { background: #1ed760; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* share box */
    .share-box {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 1.25rem;
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    .share-box.visible { display: flex; }
    .share-box-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--green);
    }
    .share-url-row {
      display: flex;
      gap: 8px;
    }
    .share-url {
      flex: 1;
      background: var(--bg);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.8rem;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-copy {
      background: var(--surface2);
      color: var(--white);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 0 14px;
      font-family: var(--font);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .btn-copy:hover { background: var(--green); color: #000; border-color: var(--green); }
    .btn-copy.copied { background: var(--green); color: #000; border-color: var(--green); }

    .share-actions {
      display: flex;
      gap: 8px;
    }
    .btn-share-native {
      flex: 1;
      background: transparent;
      color: var(--white);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 10px;
      font-family: var(--font);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-share-native:hover { background: var(--surface2); }

    .btn-preview-link {
      flex: 1;
      background: transparent;
      color: var(--green);
      border: 1px solid rgba(29,185,84,0.3);
      border-radius: 8px;
      padding: 10px;
      font-family: var(--font);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }
    .btn-preview-link:hover { background: rgba(29,185,84,0.08); }

    /* spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: var(--white);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: inline-block;
    }

    /* error */
    .error-msg {
      font-size: 0.82rem;
      color: #ff5f5f;
      padding: 0 4px;
      display: none;
    }
    .error-msg.visible { display: block; }

    /* loading skeleton */
    .skeleton {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      padding: 2rem 0;
    }
    .skel-circle {
      width: 300px; height: 300px; border-radius: 50%;
      background: linear-gradient(90deg, #1a1a1a 0%, #222 50%, #1a1a1a 100%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    .skel-line {
      height: 20px; border-radius: 6px;
      background: linear-gradient(90deg, #1a1a1a 0%, #222 50%, #1a1a1a 100%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media (max-width: 400px) {
      .vinyl, .vinyl-stage { width: 260px; height: 260px; }
      .vinyl-label { width: 94px; height: 94px; }
      .track-name { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
<div id="app"></div>

<script>
// ──────────────────────────────────
// Helpers
// ──────────────────────────────────
function extractTrackId(input) {
  input = input.trim();
  // full URL: https://open.spotify.com/track/XXXX?si=...
  const urlMatch = input.match(/spotify\.com\/track\/([a-zA-Z0-9]+)/);
  if (urlMatch) return urlMatch[1];
  // URI: spotify:track:XXXX
  const uriMatch = input.match(/spotify:track:([a-zA-Z0-9]+)/);
  if (uriMatch) return uriMatch[1];
  // bare ID (22 chars)
  if (/^[a-zA-Z0-9]{22}$/.test(input)) return input;
  return null;
}

async function fetchTrackMeta(trackId) {
  const url = `https://open.spotify.com/oembed?url=https://open.spotify.com/track/${trackId}&format=json`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Track not found');
  const data = await res.json();
  // title is "Song Name - Artist" or "Song Name"
  const parts = data.title.split(' - ');
  return {
    title: parts[0] || data.title,
    artist: parts.slice(1).join(' - ') || '',
    thumbnail: data.thumbnail_url,
    embedHtml: data.html,
    trackId,
  };
}

function encodeMsg(msg) {
  try { return btoa(unescape(encodeURIComponent(msg))); } catch { return ''; }
}
function decodeMsg(b64) {
  try { return decodeURIComponent(escape(atob(b64))); } catch { return ''; }
}

// ──────────────────────────────────
// SVG Icons
// ──────────────────────────────────
const SVG = {
  spotify: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>`,
  play: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`,
  pause: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`,
  check: `<svg viewBox="0 0 20 20" fill="currentColor" width="20" height="20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>`,
  share: `<svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>`,
  link: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>`,
};

// ──────────────────────────────────
// Gift View (recipient sees this)
// ──────────────────────────────────
async function renderGiftView(trackId, encodedMsg) {
  const app = document.getElementById('app');
  const message = encodedMsg ? decodeMsg(encodedMsg) : '';

  // loading skeleton
  app.innerHTML = `
    <div class="skeleton">
      <div class="skel-circle"></div>
      <div class="skel-line" style="width:180px"></div>
      <div class="skel-line" style="width:120px"></div>
    </div>`;

  let meta;
  try {
    meta = await fetchTrackMeta(trackId);
  } catch (e) {
    app.innerHTML = `<div style="text-align:center;color:var(--muted);padding:4rem 2rem">
      <div style="font-size:2rem;margin-bottom:1rem">🎵</div>
      <p>Couldn't load this track.</p>
      <p style="font-size:0.85rem;margin-top:8px">Check the link and try again.</p>
    </div>`;
    return;
  }

  // update page meta
  document.title = `${meta.title} — A song for you`;

  let isPlaying = false;

  const html = `
    <div class="vinyl-wrap">
      <div class="vinyl-stage">
        <!-- tonearm -->
        <svg class="tonearm tonearm-svg" viewBox="0 0 90 120" fill="none" xmlns="http://www.w3.org/2000/svg" style="position:absolute;top:-10px;right:-30px;width:90px;height:120px;transform-origin:top right;transform:rotate(-30deg);transition:transform 0.6s ease;z-index:10">
          <circle cx="78" cy="12" r="9" fill="#2a2a2a" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
          <line x1="78" y1="21" x2="20" y2="108" stroke="#3a3a3a" stroke-width="4" stroke-linecap="round"/>
          <circle cx="20" cy="109" r="4" fill="#555"/>
          <circle cx="78" cy="12" r="4" fill="rgba(255,255,255,0.1)"/>
        </svg>

        <!-- vinyl -->
        <div class="vinyl" id="vinyl">
          <div class="vinyl-disc"></div>
          <div class="vinyl-label" id="vinyl-label">
            ${meta.thumbnail
              ? `<img src="${meta.thumbnail}" alt="${meta.title}" id="album-art">`
              : `<div class="label-placeholder">🎵</div>`}
          </div>
          <div class="vinyl-dot"></div>
        </div>

        <!-- play overlay -->
        <div class="vinyl-play-btn" id="play-btn" title="Play / Pause">
          <svg id="play-icon" viewBox="0 0 24 24" fill="white">${SVG.play}</svg>
        </div>
      </div>

      <div class="track-info">
        <div class="track-name">${meta.title}</div>
        <div class="track-artist">${meta.artist}</div>
        <a class="btn-spotify" href="https://open.spotify.com/track/${meta.trackId}" target="_blank" rel="noopener">
          ${SVG.spotify}
          Open in Spotify
        </a>
      </div>
    </div>

    ${message ? `
    <div class="message-card">
      <div class="message-label">A message for you</div>
      <div class="message-text">${escapeHtml(message)}</div>
    </div>` : ''}

    <!-- Spotify embed (hidden, just for audio) -->
    <div class="embed-wrap" id="embed-wrap" style="display:none">
      <iframe id="spotify-embed"
        src="https://open.spotify.com/embed/track/${meta.trackId}?utm_source=generator"
        width="100%" height="80" frameborder="0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"></iframe>
    </div>

    <div class="footer-link">
      <a href="${window.location.origin}${window.location.pathname}">Send your own music gift →</a>
    </div>`;

  app.innerHTML = html;

  // tonearm element
  const arm = app.querySelector('.tonearm-svg');
  const vinyl = document.getElementById('vinyl');
  const playBtn = document.getElementById('play-btn');
  const playIcon = document.getElementById('play-icon');
  const embedWrap = document.getElementById('embed-wrap');

  playBtn.addEventListener('click', () => {
    isPlaying = !isPlaying;
    vinyl.classList.toggle('playing', isPlaying);
    arm.style.transform = isPlaying ? 'rotate(-18deg)' : 'rotate(-30deg)';
    playIcon.innerHTML = isPlaying ? SVG.pause : SVG.play;
    // reveal embed on first play so Spotify can load
    if (isPlaying && embedWrap.style.display === 'none') {
      embedWrap.style.display = 'block';
    }
  });
}

// ──────────────────────────────────
// Creator Mode
// ──────────────────────────────────
function renderCreator() {
  const app = document.getElementById('app');
  document.title = 'Spotify Gift — Create a music gift';

  let trackMeta = null;
  let fetchTimer = null;

  app.innerHTML = `
    <div class="creator">
      <div class="creator-header">
        <h1>Send a Music Gift</h1>
        <p>Share a song with a personal message</p>
      </div>

      <div class="field">
        <label>Spotify Track Link</label>
        <input type="url" id="track-input" placeholder="https://open.spotify.com/track/…" autocomplete="off" spellcheck="false">
        <span class="error-msg" id="track-error">Couldn't find that track. Paste a Spotify track link.</span>
      </div>

      <div class="track-preview" id="track-preview">
        <img id="preview-art" src="" alt="">
        <div class="track-preview-info">
          <div class="track-preview-name" id="preview-name"></div>
          <div class="track-preview-artist" id="preview-artist"></div>
        </div>
        <span class="track-preview-check">${SVG.check}</span>
      </div>

      <div class="field">
        <label>Your Message</label>
        <textarea id="msg-input" placeholder="This song made me think of you…" maxlength="500"></textarea>
      </div>

      <button class="btn-primary" id="gen-btn" disabled>Generate Gift Link</button>

      <div class="share-box" id="share-box">
        <div class="share-box-label">Your gift link is ready</div>
        <div class="share-url-row">
          <div class="share-url" id="share-url-text"></div>
          <button class="btn-copy" id="copy-btn">Copy</button>
        </div>
        <div class="share-actions">
          <button class="btn-share-native" id="native-share-btn">${SVG.share} Share</button>
          <a class="btn-preview-link" id="preview-link" href="#" target="_blank">${SVG.link} Preview</a>
        </div>
      </div>
    </div>`;

  const trackInput = document.getElementById('track-input');
  const trackError = document.getElementById('track-error');
  const trackPreview = document.getElementById('track-preview');
  const previewArt = document.getElementById('preview-art');
  const previewName = document.getElementById('preview-name');
  const previewArtist = document.getElementById('preview-artist');
  const msgInput = document.getElementById('msg-input');
  const genBtn = document.getElementById('gen-btn');
  const shareBox = document.getElementById('share-box');
  const shareUrlText = document.getElementById('share-url-text');
  const copyBtn = document.getElementById('copy-btn');
  const nativeShareBtn = document.getElementById('native-share-btn');
  const previewLink = document.getElementById('preview-link');

  function setError(msg) {
    trackError.textContent = msg;
    trackError.classList.toggle('visible', !!msg);
  }

  async function lookupTrack() {
    const raw = trackInput.value.trim();
    if (!raw) {
      trackMeta = null;
      trackPreview.classList.remove('visible');
      genBtn.disabled = true;
      setError('');
      return;
    }
    const id = extractTrackId(raw);
    if (!id) {
      trackMeta = null;
      trackPreview.classList.remove('visible');
      genBtn.disabled = true;
      setError('Paste a Spotify track link (e.g. https://open.spotify.com/track/…)');
      return;
    }
    setError('');
    // show loading state
    genBtn.disabled = true;
    genBtn.innerHTML = `<span class="spinner"></span>`;
    try {
      trackMeta = await fetchTrackMeta(id);
      previewArt.src = trackMeta.thumbnail || '';
      previewArt.style.display = trackMeta.thumbnail ? 'block' : 'none';
      previewName.textContent = trackMeta.title;
      previewArtist.textContent = trackMeta.artist;
      trackPreview.classList.add('visible');
      genBtn.disabled = false;
      genBtn.textContent = 'Generate Gift Link';
      setError('');
    } catch {
      trackMeta = null;
      trackPreview.classList.remove('visible');
      genBtn.disabled = true;
      genBtn.textContent = 'Generate Gift Link';
      setError("Couldn't load that track. Make sure it's a public Spotify track link.");
    }
  }

  trackInput.addEventListener('input', () => {
    clearTimeout(fetchTimer);
    fetchTimer = setTimeout(lookupTrack, 600);
  });

  trackInput.addEventListener('paste', () => {
    clearTimeout(fetchTimer);
    fetchTimer = setTimeout(lookupTrack, 100);
  });

  genBtn.addEventListener('click', () => {
    if (!trackMeta) return;
    const msg = msgInput.value.trim();
    const params = new URLSearchParams({ t: trackMeta.trackId });
    if (msg) params.set('m', encodeMsg(msg));
    const giftUrl = `${window.location.origin}${window.location.pathname}?${params.toString()}`;
    shareUrlText.textContent = giftUrl;
    previewLink.href = giftUrl;
    shareBox.classList.add('visible');
    shareBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });

  copyBtn.addEventListener('click', async () => {
    const url = shareUrlText.textContent;
    try {
      await navigator.clipboard.writeText(url);
      copyBtn.textContent = 'Copied!';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = 'Copy';
        copyBtn.classList.remove('copied');
      }, 2000);
    } catch {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = url;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      copyBtn.textContent = 'Copied!';
      copyBtn.classList.add('copied');
      setTimeout(() => { copyBtn.textContent = 'Copy'; copyBtn.classList.remove('copied'); }, 2000);
    }
  });

  nativeShareBtn.addEventListener('click', async () => {
    const url = shareUrlText.textContent;
    if (navigator.share) {
      try {
        await navigator.share({
          title: `${trackMeta?.title || 'A song'} — for you`,
          text: msgInput.value.trim() || 'Someone sent you a music gift',
          url,
        });
      } catch {}
    } else {
      // fallback: copy
      copyBtn.click();
    }
  });
}

// ──────────────────────────────────
// Security: HTML escape
// ──────────────────────────────────
function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ──────────────────────────────────
// Router
// ──────────────────────────────────
const params = new URLSearchParams(window.location.search);
const trackId = params.get('t');
const encodedMsg = params.get('m');

if (trackId) {
  renderGiftView(trackId, encodedMsg);
} else {
  renderCreator();
}
</script>
</body>
</html>
