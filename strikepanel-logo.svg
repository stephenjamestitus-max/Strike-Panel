<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 460 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="strikepanel logo">
  <title>strikepanel™</title>
  <defs>

    <!-- Orb gradient: deep navy → midnight -->
    <radialGradient id="orb-fill" cx="38%" cy="32%" r="65%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#1e2844"/>
      <stop offset="50%"  stop-color="#0f1428"/>
      <stop offset="100%" stop-color="#080c18"/>
    </radialGradient>

    <!-- Cyan glow filter for the mark -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft drop shadow for the orb -->
    <filter id="orb-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00D4F0" flood-opacity="0.25"/>
    </filter>

    <!-- Wordmark gradient: white → light cyan -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c8f8ff"/>
    </linearGradient>

    <!-- Clip path for the orb -->
    <clipPath id="orb-clip">
      <circle cx="60" cy="60" r="54"/>
    </clipPath>

  </defs>

  <!-- ══════════════════════════════════════
       LOGO MARK  (120×120 viewport, 0,0)
  ══════════════════════════════════════ -->
  <g transform="translate(0,0)" filter="url(#orb-shadow)">

    <!-- Outer ring / body -->
    <circle cx="60" cy="60" r="54" fill="url(#orb-fill)"
            stroke="#00D4F0" stroke-width="1.6" stroke-opacity="0.55"/>

    <!-- Inner ring (subtle) -->
    <circle cx="60" cy="60" r="36" fill="none"
            stroke="#00D4F0" stroke-width="1" stroke-opacity="0.18"/>

    <!-- Cardinal spokes — full length -->
    <g filter="url(#glow)" stroke="#00D4F0" stroke-linecap="round">
      <line x1="60" y1="6"  x2="60" y2="33"  stroke-width="3"/>
      <line x1="60" y1="87" x2="60" y2="114" stroke-width="3"/>
      <line x1="6"  y1="60" x2="33" y2="60"  stroke-width="3"/>
      <line x1="87" y1="60" x2="114" y2="60" stroke-width="3"/>
    </g>

    <!-- Diagonal corner ticks (45°) — subtle -->
    <g stroke="#00D4F0" stroke-linecap="round" stroke-opacity="0.45">
      <line x1="19" y1="19" x2="27" y2="27" stroke-width="1.8"/>
      <line x1="101" y1="101" x2="93" y2="93" stroke-width="1.8"/>
      <line x1="101" y1="19"  x2="93" y2="27"  stroke-width="1.8"/>
      <line x1="19"  y1="101" x2="27" y2="93"  stroke-width="1.8"/>
    </g>

    <!-- Centre node -->
    <circle cx="60" cy="60" r="13" fill="#00D4F0" filter="url(#glow)"/>

    <!-- Specular highlight on node -->
    <circle cx="55.5" cy="55.5" r="4.5" fill="white" fill-opacity="0.22"/>

    <!-- SP monogram -->
    <text x="60" y="64.5"
          font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
          font-weight="900" font-size="10" fill="#07111e"
          text-anchor="middle" letter-spacing="0.8">SP</text>

  </g>

  <!-- ══════════════════════════════════════
       WORDMARK  — right of mark
  ══════════════════════════════════════ -->
  <g transform="translate(138, 0)">

    <!-- strikepanel -->
    <text y="72"
          font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
          font-weight="900" font-size="52" letter-spacing="1"
          fill="url(#text-grad)">strikepanel</text>

    <!-- TM superscript -->
    <text x="308" y="30"
          font-family="Arial,sans-serif"
          font-weight="700" font-size="16" fill="#00D4F0" fill-opacity="0.85">™</text>

    <!-- Tagline -->
    <text y="93"
          font-family="'Courier New',Courier,monospace"
          font-weight="700" font-size="13" letter-spacing="5"
          fill="#00D4F0" fill-opacity="0.7">TRAINING INTELLIGENCE</text>

    <!-- Accent rule under tagline -->
    <rect x="0" y="100" width="320" height="1.5" fill="#00D4F0" fill-opacity="0.35" rx="1"/>

  </g>

</svg>
